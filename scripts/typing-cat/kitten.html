<!doctype html>
<!--
  Keyboard Kitten (embed). A black kitten typing on a mechanical keyboard; fills whatever box it's in.

  Use it in an iframe:
    <iframe src="keyboard-kitten-embed.html?eyes=verde&energy=70" style="width:100%;height:520px;border:0"></iframe>

  URL parameters (all optional)
    eyes    ambar | verde | cobre | azul, or a hex colour such as f2a516   (default ambar)
    energy  0-100, how frantically it types                                (default 60)
    bg      background hex such as f7f4ef, to match the host page         (default ffffff)
    sound   1 to enable the synthesized key clicks and purr (they start on the first click inside the frame)

  Messages the host page can send:   iframe.contentWindow.postMessage(msg, '*')
    { kitten: 'yarn' }                       throw a ball of yarn
    { kitten: 'eyes', value: 'azul' }        eye colour (name or hex)
    { kitten: 'energy', value: 80 }          0-100
    { kitten: 'sound', value: true }         key clicks and purr on/off

  Messages the frame sends to the host (window.addEventListener('message', ...)):
    { kitten: 'state', text, keysPerMinute, purrs }   whenever something changes, at most 4 times a second
                                                      text = the last 300 characters it typed

  Add ?selftest to run the physics self-checks.
  Add ?capture to stop the live loop and render frames on demand (used by
  index.html to export the frames the app plays): Math.random is seeded so a
  capture is reproducible, and window.captureFrames(seconds, fps) steps the
  simulation at exactly 1/fps per frame and returns PNG data URLs.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Kitten</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg, #ffffff); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .cursor { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .2s; }
  .cursor.on { opacity: 1; }
  .cursor i {
    position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,.62); background: rgba(0,0,0,0);
    transition: transform .22s cubic-bezier(.3,1.6,.5,1), background-color .2s, border-color .2s, box-shadow .2s;
  }
  .cursor.hover i { transform: scale(1.4); border-color: rgba(0,0,0,.8); }
  .cursor.grab i { transform: scale(2.3); background: rgba(0,0,0,.05); border-width: 1px; border-color: rgba(0,0,0,.7); }
  .cursor.laser i { transform: scale(.38); background: #ff2b2b; border-color: #ff2b2b; box-shadow: 0 0 0 6px rgba(255,43,43,.22), 0 0 18px 6px rgba(255,43,43,.45); }
  @media (pointer: coarse) { .cursor { display: none; } }
  .fail { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); max-width: 26em; font: 15px/1.5 system-ui, sans-serif; color: #5c5753; text-align: center; }
  #selftest { position: fixed; left: 12px; bottom: 12px; z-index: 20; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #fff; border: 1px solid #ebe7e4; border-radius: 8px; padding: 8px 10px; white-space: pre; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Um gatinho preto digitando num teclado mecânico"></canvas>
<div class="cursor" id="cursor"><i></i></div>

<script>
  // three.js comes from a CDN; tell the visitor what to do if it never arrives.
  setTimeout(() => {
    if (!window.__kittenReady) document.body.insertAdjacentHTML('beforeend',
      '<p class="fail">O three.js não carregou. Verifique a conexão com a internet e recarregue a página.</p>');
  }, 9000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
const CAPTURE = new URLSearchParams(location.search).has('capture');
if (CAPTURE) {
  // mulberry32: same frames on every export
  let seed = 0x6b75726f;
  Math.random = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   Keyboard: a 60% ANSI board facing the viewer, the kitten sits behind it.
   Row 0 (numbers) is at the back, nearest the kitten.
   ===================================================================== */
const U = 0.1;
const CASE_W = 1.6, CASE_D = 0.6, CASE_H = 0.04;
const KEY_BASE = CASE_H + 0.006, KEY_H = 0.04, KEY_TOP = KEY_BASE + KEY_H;
const TRAVEL = 0.016, ACT = 0.0085, KEY_SPRING = 0.12;   // a resting paw's weight must not reach the actuation point
const KB_X0 = -0.75, KB_Z0 = -0.25;
const ROWS = [
  [['esc', 1], ...'1234567890-='.split('').map(c => [c, 1]), ['backspace', 2]],
  [['tab', 1.5], ...'qwertyuiop[]'.split('').map(c => [c, 1]), ['\\', 1.5]],
  [['caps', 1.75], ..."asdfghjkl;'".split('').map(c => [c, 1]), ['enter', 2.25]],
  [['shift', 2.25], ...'zxcvbnm,./'.split('').map(c => [c, 1]), ['shift', 2.75]],
  [['ctrl', 1.25], ['opt', 1.25], ['cmd', 1.25], ['space', 6.25], ['cmd', 1.25], ['opt', 1.25], ['fn', 1.25], ['ctrl', 1.25]],
];
const SHIFTED = { '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', '6': '^', '7': '&', '8': '*', '9': '(', '0': ')', '-': '_', '=': '+',
  '[': '{', ']': '}', '\\': '|', ';': ':', "'": '"', ',': '<', '.': '>', '/': '?' };
const keys = [];
ROWS.forEach((row, r) => {
  let u = 0;

});
// key lookup on a quarter-unit grid
const KEY_GRID = ROWS.map(() => new Int16Array(60).fill(-1));
keys.forEach((k, i) => { for (let c = Math.round(k.start * 4); c < Math.round((k.start + k.w) * 4); c++) KEY_GRID[k.row][c] = i; });
function keyAt(x, z) {
  const r = Math.floor((z - KB_Z0) / U);
  if (r < 0 || r > 4) return -1;
  const c = Math.floor((x - KB_X0) / U * 4);
  return c < 0 || c >= 60 ? -1 : KEY_GRID[r][c];
}

/* =====================================================================
   Kitten anatomy. Local space: origin on the table under the hips, y up,
   facing +z (toward the keyboard and the viewer).
   ===================================================================== */
const HIP = 0, THIGH_L = 1, THIGH_R = 2, FOOT_L = 3, FOOT_R = 4, BELLY = 5, CHEST = 6, HEAD = 7, MUZZLE = 8,
      CHEEK_L = 9, CHEEK_R = 10, EAR_L = 11, EAR_R = 12, PAW_L = 13, PAW_R = 14, T0 = 15, NP = 20;

  -0.115, 0.095, -0.03,   0.115, 0.095, -0.03,  // thighs
  -0.10, 0.045, 0.12,     0.10, 0.045, 0.12,    // hind feet
  0, 0.250, 0.02,                               // belly
  0, 0.370, 0.09,                               // chest
  0, 0.600, 0.14,                               // head
  0, 0.555, 0.265,                              // muzzle
  -0.068, 0.550, 0.205,   0.068, 0.550, 0.205,  // cheeks
  -0.092, 0.805, 0.11,    0.092, 0.805, 0.11,   // ear tips
  -0.09, 0.140, 0.36,     0.09, 0.140, 0.36,    // front paws, resting lightly on the number row
  0.03, 0.06, -0.25,  0.12, 0.04, -0.32,  0.23, 0.04, -0.31,  0.31, 0.035, -0.22,  0.35, 0.03, -0.10,  // tail
]);
const RAISED_TAIL = [0.02, 0.16, -0.26,  0.03, 0.27, -0.30,  0.04, 0.39, -0.31,  0.06, 0.50, -0.28,  0.10, 0.58, -0.21];
const RAD  = [0.155, 0.095, 0.095, 0.045, 0.045, 0.125, 0.115, 0.145, 0.058, 0.055, 0.055, 0.014, 0.014, 0.047, 0.047, 0.036, 0.032, 0.029, 0.026, 0.023];
const MASS = [0.42, 0.14, 0.14, 0.06, 0.06, 0.20, 0.13, 0.12, 0.02, 0.02, 0.02, 0.008, 0.008, 0.025, 0.025, 0.02, 0.02, 0.02, 0.02, 0.02];  // sits back on its hips
// the tail swings freely and the paws move under their own power: neither tugs on the body's fit
const FITW = MASS.map((m, i) => i >= PAW_L ? 0 : m);
const SOFT = [1, 1, 1, 0.8, 0.8, 1, 1, 0.95, 0.9, 0.9, 0.9, 0.75, 0.75, 0.75, 0.75, 0.25, 0.18, 0.14, 0.11, 0.09];
const HEAD_GROUP = [HEAD, MUZZLE, CHEEK_L, CHEEK_R, EAR_L, EAR_R];
const TORSO = [HIP, BELLY, CHEST];
const NECK = [0, 0.48, 0.12];
// implicit surface: smooth union of ellipsoids and round-cone strands
const SPHERES = [[HIP, 0.08], [THIGH_L, 0.06], [THIGH_R, 0.06], [FOOT_L, 0.035], [FOOT_R, 0.035], [BELLY, 0.08], [CHEST, 0.07],
  [HEAD, 0.06], [MUZZLE, 0.035], [CHEEK_L, 0.04], [CHEEK_R, 0.04], [PAW_L, 0.035], [PAW_R, 0.035]];
// [a, offset from a (body frame) or null, b, radius at a, radius at b, blend width, flat (ears)]
const STRANDS = [
  [HIP, null, BELLY, 0.13, 0.12, 0.07, false],
  [BELLY, null, CHEST, 0.115, 0.105, 0.07, false],
  [CHEST, null, HEAD, 0.085, 0.085, 0.07, false],
  [CHEST, [-0.055, -0.03, 0.04], PAW_L, 0.046, 0.036, 0.04, false],
  [CHEST, [0.055, -0.03, 0.04], PAW_R, 0.046, 0.036, 0.04, false],
  [THIGH_L, null, FOOT_L, 0.05, 0.036, 0.04, false],
  [THIGH_R, null, FOOT_R, 0.05, 0.036, 0.04, false],
  [HEAD, null, EAR_L, 0.1, 0.012, 0.025, true],
  [HEAD, null, EAR_R, 0.1, 0.012, 0.025, true],

const strandEnd = (P, s) => { const [a, off] = STRANDS[s]; return [P[a*3] + (off ? off[0] : 0), P[a*3+1] + (off ? off[1] : 0), P[a*3+2] + (off ? off[2] : 0)]; };
const STRAND_L0 = STRANDS.map(([, , b], s) => { const a = strandEnd(RESTL, s); return Math.hypot(RESTL[b*3]-a[0], RESTL[b*3+1]-a[1], RESTL[b*3+2]-a[2]); });

  .map(([a, b]) => [a, b, Math.hypot(RESTL[b*3]-RESTL[a*3], RESTL[b*3+1]-RESTL[a*3+1], RESTL[b*3+2]-RESTL[a*3+2])]);
const HOME = [0, 0, -0.56];

/* =====================================================================
   Simulation constants
   ===================================================================== */
const H = 1 / 240, GRAV = 22;
const BETA = 0, GAMMA = 0;       // a firm kitten: no jelly squash, no blob stretch
const MU_S = 0.6, MU_K = 0.5;
const REACH = 0.14;   // a held paw follows the hand only this far from where the body wants it
const HOLD_DAMP = 0.012, SETTLE_DAMP = 0.03, SETTLE_TIME = 0.25, FAR_DAMP = 0.14;
const RES = 50, MAX_POLY = 40000;
const sim = { alpha: 0, damp: 0, energy: 0.6, ai: true, time: 0, acc: 0, purrs: 0 };
(function stiffness() {
  const f = 30;                                   // stiff: a kitten, not a gummy
  sim.alpha = (2 * Math.PI * f * H) ** 2;
  sim.damp = 0.06;                                // and heavily damped: no jiggle after a bump
})();

/* =====================================================================
   Small 3x3 helpers (row-major) — same toolkit as the gummy bears
   ===================================================================== */
function inv3(m, out) {
  const a = m[0], b = m[1], c = m[2], d = m[3], e = m[4], f = m[5], g = m[6], h = m[7], i = m[8];
  const A = e*i - f*h, B = f*g - d*i, C = d*h - e*g;
  const det = a*A + b*B + c*C;
  if (Math.abs(det) < 1e-12) return 0;
  const k = 1 / det;
  out[0] = A*k; out[1] = (c*h - b*i)*k; out[2] = (b*f - c*e)*k;
  out[3] = B*k; out[4] = (a*i - c*g)*k; out[5] = (c*d - a*f)*k;
  out[6] = C*k; out[7] = (b*g - a*h)*k; out[8] = (a*e - b*d)*k;
  return det;
}
function quatToMat(x, y, z, w, R) {
  R[0] = 1 - 2*(y*y + z*z); R[1] = 2*(x*y - w*z);     R[2] = 2*(x*z + w*y);
  R[3] = 2*(x*y + w*z);     R[4] = 1 - 2*(x*x + z*z); R[5] = 2*(y*z - w*x);
  R[6] = 2*(x*z - w*y);     R[7] = 2*(y*z + w*x);     R[8] = 1 - 2*(x*x + y*y);
  return R;
}
// Rotational part of A (Mueller et al. 2016), warm-started from quaternion q.
function extractRotation(q, A, R, iters) {
  let qx = q[0], qy = q[1], qz = q[2], qw = q[3];
  for (let it = 0; it < iters; it++) {
    quatToMat(qx, qy, qz, qw, R);
    let ox = 0, oy = 0, oz = 0, dot = 0;
    for (let c = 0; c < 3; c++) {
      const rx = R[c], ry = R[3+c], rz = R[6+c], ax = A[c], ay = A[3+c], az = A[6+c];
      ox += ry*az - rz*ay; oy += rz*ax - rx*az; oz += rx*ay - ry*ax;
      dot += rx*ax + ry*ay + rz*az;
    }
    const s = 1 / (Math.abs(dot) + 1e-9);
    ox *= s; oy *= s; oz *= s;
    const w = Math.hypot(ox, oy, oz);
    if (w < 1e-9) break;
    const hs = Math.sin(w * 0.5) / w, dx = ox*hs, dy = oy*hs, dz = oz*hs, dw = Math.cos(w * 0.5);
    const nx = dw*qx + dx*qw + dy*qz - dz*qy, ny = dw*qy - dx*qz + dy*qw + dz*qx;
    const nz = dw*qz + dx*qy - dy*qx + dz*qw, nw = dw*qw - dx*qx - dy*qy - dz*qz;
    const l = 1 / Math.hypot(nx, ny, nz, nw);
    qx = nx*l; qy = ny*l; qz = nz*l; qw = nw*l;
  }
  q[0] = qx; q[1] = qy; q[2] = qz; q[3] = qw;
  quatToMat(qx, qy, qz, qw, R);

// pose P -> offsets Q from the wc-weighted centroid, and the inverse of the wa-weighted Aqq
const _S9 = new Float64Array(9);
function restFrame(wc, wa, P, Q, Ainv) {
  let M = 0, cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < NP; i++) { M += wc[i]; cx += wc[i]*P[i*3]; cy += wc[i]*P[i*3+1]; cz += wc[i]*P[i*3+2]; }
  cx /= M; cy /= M; cz /= M;
  const S = _S9; S.fill(0);
  for (let i = 0; i < NP; i++) {
    const x = P[i*3]-cx, y = P[i*3+1]-cy, z = P[i*3+2]-cz, w = wa[i];
    Q[i*3] = x; Q[i*3+1] = y; Q[i*3+2] = z;
    S[0] += w*x*x; S[1] += w*x*y; S[2] += w*x*z; S[4] += w*y*y; S[5] += w*y*z; S[8] += w*z*z;
  }
  S[3] = S[1]; S[6] = S[2]; S[7] = S[5];
  inv3(S, Ainv);
  return [cx, cy, cz];

const REST_C = restFrame(FITW, FITW, RESTL, new Float64Array(NP*3), new Float64Array(9));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

/* =====================================================================
   Renderer, scene, lights
   ===================================================================== */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;

renderer.setClearColor(0xffffff, 1);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 80);

const key = new THREE.DirectionalLight(0xffffff, 2.3);
key.position.set(-2.4, 4.2, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.7, right: 1.7, top: 1.7, bottom: -1.7, near: 1, far: 12 });
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
// strong rim lights: a black cat is read by its outline
const rimCool = new THREE.DirectionalLight(0xd6e2ff, 5.5);
rimCool.position.set(-2.6, 2.4, -4);
const rimWarm = new THREE.DirectionalLight(0xffe2c6, 3.6);
rimWarm.position.set(2.8, 2.2, -3.6);

// the page is the table: white background, the floor only catches shadows
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.receiveShadow = true;
scene.add(floor);

// soft contact blobs (ambient occlusion under the kitten, the board and the yarn)
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const blobMat = new THREE.ShaderMaterial({
  uniforms: { opacity: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform float opacity; varying vec2 vUv;
    void main() {
      vec2 p = (vUv - 0.5) * 2.0; float d2 = dot(p, p);
      float a = (0.6 * exp(-d2 * 3.0) + 0.4 * exp(-d2 * 9.0)) * opacity * (1.0 - smoothstep(0.75, 1.0, sqrt(d2)));

    }`,
  blending: THREE.CustomBlending, blendSrc: THREE.ZeroFactor, blendDst: THREE.SrcColorFactor,
  depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
});
function blob(opacity) {
  const m = new THREE.Mesh(blobGeo, blobMat.clone());
  m.material.uniforms.opacity.value = opacity;
  m.renderOrder = 1;
  m.position.y = 0.002;
  scene.add(m);
  return m;
}

/* =====================================================================
   Keyboard meshes
   ===================================================================== */
const EYES = [
  { name: 'Âmbar', hex: '#f2a516' },
  { name: 'Verde', hex: '#9cc43b' },
  { name: 'Cobre', hex: '#d2702c' },
  { name: 'Azul', hex: '#6aa7e0' },

const keyboard = new THREE.Group();
scene.add(keyboard);
{
  const body = new THREE.Mesh(new RoundedBoxGeometry(CASE_W, CASE_H, CASE_D, 4, 0.016),
    new THREE.MeshStandardMaterial({ color: 0xd2cec7, roughness: 0.45, metalness: 0.25 }));
  body.position.y = CASE_H / 2;
  body.castShadow = body.receiveShadow = true;
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.52, 0.52).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x77736d, roughness: 0.7 }));
  plate.position.y = CASE_H + 0.0004;
  plate.receiveShadow = true;

  blob(0.9).scale.set(2.1, 1, 0.95);
}
// legends for the whole board on one canvas, sampled by key-cap tops in board space
const LEG_MIN = [KB_X0 - 0.01, KB_Z0 - 0.01], LEG_SIZE = [1.52, 0.52];
const legendTex = (() => {
  const W = 2048, Hc = Math.round(W * LEG_SIZE[1] / LEG_SIZE[0]), cv = document.createElement('canvas');
  cv.width = W; cv.height = Hc;

    const big = !k.mod;
    g.font = `${big ? 600 : 500} ${big ? 34 : 21}px "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif`;
    g.fillText(k.label, (k.x - LEG_MIN[0]) * s, (k.z - LEG_MIN[1]) * s - 4);
  }
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 8;
  return t;
})();
const capGeo = (() => {
  const geo = new RoundedBoxGeometry(0.088, KEY_H, 0.088, 2, 0.01), p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getY(i) > 0) { p.setX(i, p.getX(i) * 0.84); p.setZ(i, p.getZ(i) * 0.84); }   // sculpted, narrower top

const capMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });
const legendUniforms = { uLegend: { value: legendTex }, uKbMin: { value: new THREE.Vector2(...LEG_MIN) }, uKbSize: { value: new THREE.Vector2(...LEG_SIZE) } };

  if ((sendT -= dt) <= 0 && parent !== window) {
    sendT = 0.25;
    while (pressTimes.length && sim.time - pressTimes[0] > 10) pressTimes.shift();
    const state = { kitten: 'state', text: typed.slice(-300), keysPerMinute: Math.round(pressTimes.length * 6), purrs: sim.purrs };
    const key = JSON.stringify(state);
    if (key !== sent) { sent = key; parent.postMessage(state, '*'); }
  }
  if (mind.laser > 0.25 && !grab) setCursor('laser'); else if (cursorEl.classList.contains('laser')) setCursor('');
  if (purrAmp) purrAmp.gain.setTargetAtTime(soundOn ? mind.purr * 0.22 : 0, audio.currentTime, 0.1);
}

/* =====================================================================
   Frame loop
   ===================================================================== */
const _from = new THREE.Vector3(), _tgt = new THREE.Vector3(), _bFrom = new THREE.Vector3(), _bTgt = new THREE.Vector3();
function simulate(dt) {
  sim.time += dt;
  think(dt);
  keysFrame(dt);
  buildPose();
  placeDrivenPaws();
  restFrame(kit.wc, kit.wa, POSE, kit.Q, kit.Ainv);
  sim.acc += dt;
  let n = Math.floor(sim.acc / H);
  if (n > 10) { n = 10; sim.acc = 0; } else sim.acc -= n * H;
  const paw = grab && grab.kind === 'paw', ball = grab && grab.kind === 'ball';
  if (grab) { _from.copy(grab.cur); grab.cur.copy(grab.target); }
  for (let s = 0; s < n; s++) {
    if (grab) _tgt.lerpVectors(_from, grab.cur, (s + 1) / n);
    step(H, paw ? _tgt : null, ball ? _tgt : null);
  }
}
function present(dt) {
  updateVisual();
  buildMesh();
  placeFace(dt);
  placeKeys(false);
  for (let j = balls.length - 1; j >= 0; j--) {
    const b = balls[j];
    if (b.dying && (b.dying -= dt) <= 0) { removeBall(b); continue; }
    ballVisual(b, dt);
  }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  simulate(dt);
  present(dt);
  renderer.render(scene, camera);
  ui(dt);
}

/* =====================================================================
   Self-test: open the page with ?selftest
   ===================================================================== */
function runSelfTest() {
  const lines = [], ok = (name, pass, info = '') => { lines.push(`${pass ? 'PASS' : 'FAIL'}  ${name}  ${info}`); return pass; };
  const frameStep = (secs, opts = {}) => {
    for (let t = 0; t < secs; t += 1 / 60) {
      sim.time += 1 / 60;
      if (opts.think) think(1 / 60);
      keysFrame(1 / 60);
      buildPose(); placeDrivenPaws(); restFrame(kit.wc, kit.wa, POSE, kit.Q, kit.Ainv);
      for (let s = 0; s < 4; s++) step(H, opts.target || null, null);
      updateVisual();
      if (opts.each) opts.each();
    }
  };
  const shapeErr = () => {
    fit(kit);
    const R = kit.R, c = kit.c, Q = kit.Q;
    let e = 0;
    for (let i = 0; i < T0; i++) {
      const k = i*3, qx = Q[k], qy = Q[k+1], qz = Q[k+2];
      e = Math.max(e, Math.hypot(kit.x[k] - (c[0] + R[0]*qx + R[1]*qy + R[2]*qz), kit.x[k+1] - (c[1] + R[3]*qx + R[4]*qy + R[5]*qz), kit.x[k+2] - (c[2] + R[6]*qx + R[7]*qy + R[8]*qz)));
    }
    return e;
  };
  const up = () => { fit(kit); return kit.R[4]; };
  const fresh = () => { sim.ai = false; mind.paws.forEach(p => { p.driven = false; p.phase = 'rest'; }); grab = null; setGrabPaw(-1); kit.settle = 0; resetKitten(); keys.forEach(k => { k.d = k.v = 0; k.down = false; }); typed = ''; frameStep(1.5); };
  // 1. rotation extraction
  {
    const q0 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.7, -1.1, 0.4));
    const R0 = quatToMat(q0.x, q0.y, q0.z, q0.w, new Float64Array(9)), S = [1.3, 0.1, 0, 0.1, 0.8, 0.05, 0, 0.05, 1.1], A = new Float64Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) A[r*3+c] = R0[r*3]*S[c] + R0[r*3+1]*S[3+c] + R0[r*3+2]*S[6+c];
    const q = [0, 0, 0, 1], R = new Float64Array(9);
    extractRotation(q, A, R, 60);
    const err = Math.max(...R.map((v, i) => Math.abs(v - R0[i])));
    ok('polar decomposition', err < 1e-4, `err=${err.toExponential(1)}`);
  }
  // 2. resting kitten: keeps its shape, stays upright, resting paws do not type
  fresh();
  const typed0 = typed.length;
  frameStep(2);
  ok('sits still', shapeErr() < 0.04 && up() > 0.97, `err=${shapeErr().toFixed(3)} up=${up().toFixed(3)}`);
  ok('resting paws type nothing', typed.length === typed0, `typed "${typed}"`);
  updateVisual(); const t0 = performance.now(); buildMesh(); const ms = performance.now() - t0;
  ok('fur mesh', furMC.count / 3 > 2000 && furMC.count / 3 < MAX_POLY, `${furMC.count / 3} tris, ${ms.toFixed(1)} ms`);
  // 3. a paw strike presses the key under it and the key springs back
  fresh();
  const p = mind.paws[1], kk = keys[keyAt(p.spot.x, p.spot.z)];
  p.driven = true; p.phase = 'rest';
  strike(p, kk.x, kk.z, { hold: 0.08 });
  let deepest = 0;
  frameStep(0.4, { each: () => { pawGoal(p, 1 / 240 * 4); deepest = Math.max(deepest, kk.d); } });
  p.driven = false;
  frameStep(0.4);
  ok('strike types a key', typed.includes(kk.label), `key "${kk.label}" depth ${deepest.toFixed(4)} typed "${typed}"`);
  ok('key releases', !kk.down && kk.d < ACT, `d=${kk.d.toFixed(5)}`);
  // 3b. while typing, a paw resting between strikes only touches its key lightly
  fresh();
  sim.ai = true; mind.idleT = 99;
  let restDepth = 0;
  frameStep(6, { think: true, each: () => { for (const q of mind.paws) if (q.phase === 'rest' && q.t > 0.35) { const ki = keyAt(q.spot.x, q.spot.z); if (ki >= 0) restDepth = Math.max(restDepth, keys[ki].d); } } });
  sim.ai = false;
  ok('resting paws touch lightly', restDepth < ACT * 0.6, `max depth under a resting paw ${restDepth.toFixed(4)} (actuates at ${ACT})`);
  // 3c. typing does not shake the body, and the voxel grid holds still under it (no shimmering surface)
  fresh();
  sim.ai = true; mind.idleT = 99;
  frameStep(0.5, { think: true });                // let the paws take their keys first
  let p1 = null, p2 = null, boxChanges = -1, lastBox = '';
  const jolts = [];
  frameStep(4, { think: true, each: () => {
    const h = [kit.x[CHEST*3], kit.x[CHEST*3+1], kit.x[CHEST*3+2]];
    if (p2) jolts.push(Math.hypot(h[0] - 2*p1[0] + p2[0], h[1] - 2*p1[1] + p2[1], h[2] - 2*p1[2] + p2[2]) * 1000);
    p2 = p1; p1 = h;
    buildMesh();
    const bx = kit.meshBox.join(); if (bx !== lastBox) { boxChanges++; lastBox = bx; }
  } });
  sim.ai = false;
  jolts.sort((a, b) => a - b);
  const j90 = jolts[Math.floor(jolts.length * 0.9)], jmax = jolts[jolts.length - 1];
  ok('steady while typing', j90 < 1 && jmax < 3 && boxChanges <= 2, `chest jolt p90 ${j90.toFixed(2)} max ${jmax.toFixed(2)} mm/frame², grid changes ${boxChanges}, typed ${typed.length}`);
  // 4. pull a paw hard: the leg stays firm (the paw only goes as far as it reaches); let go: back in place
  fresh();
  const pk = PAW_R * 3, start = new THREE.Vector3(kit.x[pk], kit.x[pk+1], kit.x[pk+2]), end = start.clone().add(new THREE.Vector3(0.35, 0.4, 0.25)), tg = start.clone();
  grab = { kind: 'paw' }; setGrabPaw(PAW_R);
  let tt = 0;
  frameStep(0.7, { target: tg, each: () => { tt += 1 / 60; tg.lerpVectors(start, end, Math.min(1, tt / 0.35)); } });
  updateVisual();
  const moved = Math.hypot(kit.x[pk] - start.x, kit.x[pk+1] - start.y, kit.x[pk+2] - start.z);
  ok('firm under a pull', kit.stretch < 1.35 && moved > 0.08 && up() > 0.8, `leg x${kit.stretch.toFixed(2)}, paw moved ${moved.toFixed(2)}, up=${up().toFixed(2)}`);
  setGrabPaw(-1); grab = null;
  frameStep(2.5);
  ok('springs back', shapeErr() < 0.05 && up() > 0.95, `err=${shapeErr().toFixed(3)} up=${up().toFixed(2)}`);
  // 5. a poke: startle hop, then back on its spot
  fresh();
  sim.ai = true;
  startle(new THREE.Vector3(kit.c[0], 0.5, kit.c[2] + 0.5));
  let peak = 0;
  frameStep(3, { think: true, each: () => { peak = Math.max(peak, kit.x[HIP*3+1]); } });
  const hd = Math.hypot(kit.c[0] - HOME[0] - REST_C[0], kit.c[2] - HOME[2] - REST_C[2]);
  ok('startle hop and recover', peak > 0.25 && up() > 0.95 && hd < 0.12, `hip peak ${peak.toFixed(2)} up=${up().toFixed(2)} home ${hd.toFixed(2)}`);
  // 6. yarn dropped on the board presses keys and never sinks into it
  fresh();
  throwYarn();
  const b = balls[balls.length - 1];
  b.x.set([0.3, 0.6, 0]); b.p.set(b.x); b.v.fill(0);
  let minGap = Infinity, finite = true;
  const typedBefore = typed.length;
  frameStep(1.2, { each: () => { minGap = Math.min(minGap, b.x[1] - (KEY_TOP - TRAVEL + YARN_R)); if (!b.x.every(Number.isFinite)) finite = false; } });
  ok('yarn presses keys', typed.length > typedBefore && finite && minGap > -0.006, `typed "${typed.slice(typedBefore, typedBefore + 20)}" min gap ${minGap.toFixed(4)}`);
  removeBall(b);
  // done: back to a calm kitten
  sim.ai = true; grab = null; setGrabPaw(-1); resetKitten(); typed = ''; pressTimes.length = 0; sim.purrs = 0;
  mind.startleT = mind.irritT = mind.puff = 0;
  const report = lines.join('\n');
  console.log(`[kitten selftest]\n${report}`);
  document.body.insertAdjacentHTML('beforeend', `<div id="selftest">${report}</div>`);
  window.__selftest = { pass: lines.every(l => l.startsWith('PASS')), report };
}

layout();
addEventListener('resize', layout);
if (new URLSearchParams(location.search).has('selftest')) runSelfTest();
window.__kittenReady = true;
if (CAPTURE) {
  window.captureFrames = (seconds, fps) => {
    mind.idleT = 1e9;   // keep typing: no idle detours inside the loop
    const dt = 1 / fps, out = [];
    for (let i = 0; i < Math.round(seconds * fps); i++) {
      simulate(dt);
      present(dt);
      renderer.render(scene, camera);
      out.push(canvas.toDataURL('image/png'));   // same task as render, so the buffer is still there
    }
    return out;
  };
} else {
  requestAnimationFrame(frame);
}
</script>
